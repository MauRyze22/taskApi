name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: llave-secreta-falsa-solo-para-test-con-CI
      ALLOWED_HOSTS: "localhost:8000,127.0.0.1"
      DEBUG: "True"
      RESEND_API_KEY: resend_clave_falsa_solo_para_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: "3.12.8"
      - run: python --version
      - run: pip install -r requirements.txt
      - run: pytest